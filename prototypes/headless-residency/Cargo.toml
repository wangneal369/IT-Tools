[package]
name = "devtools-residency-prototype"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
gpui-kit = "=0.11.0"
tray-icon = "0.27"
muda = "0.22"
global-hotkey = "0.10"
async-channel = "2"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_IO",
    "Win32_System_Pipes",
    "Win32_System_ProcessStatus",
    "Win32_System_Threading",
    "Win32_UI_WindowsAndMessaging",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
] }

[profile.dev.package."*"]
opt-level = 2
debug = 0

[profile.release]
strip = "symbols"

