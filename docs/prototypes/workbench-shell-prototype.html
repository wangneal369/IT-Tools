<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>DevTools 主工作台壳层原型</title>
<style>
  /* ==========================================================================
     PROTOTYPE — THROWAWAY ARTIFACT FOR ISSUE #9
     Calm, orderly, minimalist native desktop workbench (?variant=A|B|C).
     Supports toggling single-row vs multi-row wrapped tabs.
     ========================================================================== */
  *, *::before, *::after { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    font-family: var(--font-sans, "Segoe UI", "Microsoft YaHei UI", -apple-system, BlinkMacSystemFont, "PingFang SC", sans-serif);
    color: var(--foreground, #e5e7eb);
    font-size: 13px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }

  .ico {
    width: 14px;
    height: 14px;
    display: inline-block;
    vertical-align: -2px;
    flex-shrink: 0;
    stroke: currentColor;
    fill: none;
    stroke-width: 1.6;
    stroke-linecap: round;
    stroke-linejoin: round;
  }
  .ico-sm { width: 12.5px; height: 12.5px; vertical-align: -1.5px; }

  .proto-root {
    width: 100%;
    max-width: 1240px;
    margin: 0 auto;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  /* ==========================================================================
     ORDERLY TOP CONTROL STRIP
     ========================================================================== */
  .sim-bar {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
  }
  .sim-group {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    flex-wrap: wrap;
  }
  .sim-label {
    font-size: 11.5px;
    color: var(--muted-foreground, #8b909a);
  }
  .sim-select, .sim-btn {
    font-family: inherit;
    font-size: 11.5px;
    height: 28px;
    padding: 0 9px;
    border-radius: 6px;
    border: 1px solid var(--border, #2b2e36);
    background: var(--card, #1a1c20);
    color: var(--foreground, #e5e7eb);
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    gap: 5px;
    white-space: nowrap;
  }
  .sim-select:hover, .sim-btn:hover { border-color: var(--muted-foreground, #555b66); }
  .sim-btn.active {
    background: var(--secondary, #2a2e38);
    border-color: var(--muted-foreground, #687080);
    font-weight: 500;
  }
  .sim-seg {
    display: inline-flex;
    height: 28px;
    align-items: center;
    background: var(--card, #1a1c20);
    border: 1px solid var(--border, #2b2e36);
    border-radius: 6px;
    padding: 2px;
    gap: 2px;
  }
  .sim-seg button {
    font-family: inherit;
    font-size: 11px;
    height: 22px;
    padding: 0 8px;
    border: none;
    border-radius: 4px;
    background: transparent;
    color: var(--muted-foreground, #8b909a);
    cursor: pointer;
    white-space: nowrap;
  }
  .sim-seg button:hover { color: var(--foreground, #f3f4f6); }
  .sim-seg button.active {
    background: var(--secondary, #2a2e38);
    color: var(--foreground, #f8fafc);
    font-weight: 500;
  }

  /* ==========================================================================
     WINDOW STAGE
     ========================================================================== */
  .window-stage { width: 100%; overflow-x: auto; }
  .window-frame-holder { margin: 0 auto; transition: width 0.16s ease; }
  .window-frame-holder[data-size="fluid"] { width: 100%; }
  .window-frame-holder[data-size="desktop"] { width: 1160px; }
  .window-frame-holder[data-size="compact"] { width: 820px; }

  /* ==========================================================================
     NATIVE DEVTOOLS DESKTOP WINDOW (Comfortable Charcoal / Soft Paper)
     ========================================================================== */
  .dt-window {
    /* Soft eye-friendly charcoal dark palette (inspired by Zed / macOS) */
    --dt-bg: #1c1d21;
    --dt-chrome: #16171a;
    --dt-surface: #222429;
    --dt-hover: #282b31;
    --dt-active: #2e323a;
    --dt-border: #2a2d34;
    --dt-border-strong: #373b44;
    --dt-fg: #e6e8ec;
    --dt-fg-muted: #9aa0ab;
    --dt-fg-subtle: #69707d;
    --dt-gutter: #505662;
    /* One calm focal accent (serene macOS native blue, used sparingly) */
    --dt-accent: #3b7be0;
    --dt-accent-hover: #4a88ea;
    --dt-accent-fg: #ffffff;
    --dt-accent-soft: rgba(59, 123, 224, 0.10);
    --dt-ok: #4cb782;
    --dt-warn: #d4a04a;
    --dt-err: #e06c75;
    /* Gentle syntax highlight */
    --syn-key: #9cc4f4;
    --syn-str: #b3d6a7;
    --syn-num: #ddb07d;
    --syn-bool: #c9a8eb;
    --dt-shadow: 0 12px 32px rgba(0, 0, 0, 0.36);
    --dt-mono: var(--font-mono, "JetBrains Mono", "Cascadia Code", Consolas, monospace);

    position: relative;
    height: 540px;
    background: var(--dt-bg);
    color: var(--dt-fg);
    border: 1px solid var(--dt-border-strong);
    border-radius: 10px;
    box-shadow: var(--dt-shadow);
    display: flex;
    flex-direction: column;
    overflow: hidden;
    font-size: 12.5px;
    user-select: none;
  }

  .dt-window[data-dt-theme="light"] {
    /* Soft warm paper light palette */
    --dt-bg: #ffffff;
    --dt-chrome: #f5f6f8;
    --dt-surface: #f0f2f5;
    --dt-hover: #eaedf2;
    --dt-active: #e2e6ee;
    --dt-border: #e5e8ee;
    --dt-border-strong: #d3d8e2;
    --dt-fg: #1f2328;
    --dt-fg-muted: #59636e;
    --dt-fg-subtle: #8c959f;
    --dt-gutter: #adb5bf;
    --dt-accent: #2563eb;
    --dt-accent-hover: #1d4ed8;
    --dt-accent-fg: #ffffff;
    --dt-accent-soft: rgba(37, 99, 235, 0.08);
    --dt-ok: #1a7f37;
    --dt-warn: #9a6700;
    --dt-err: #cf222e;
    --syn-key: #0550ae;
    --syn-str: #1f6f3d;
    --syn-num: #953800;
    --syn-bool: #6639ba;
    --dt-shadow: 0 10px 28px rgba(15, 23, 42, 0.08);
  }

  .dt-window button, .dt-window input, .dt-window textarea { font-family: inherit; color: inherit; }
  .dt-window :focus-visible { outline: 1.5px solid var(--dt-accent); outline-offset: -1px; }

  .dt-btn {
    height: 27px;
    padding: 0 10px;
    border-radius: 6px;
    border: 1px solid var(--dt-border-strong);
    background: var(--dt-surface);
    color: var(--dt-fg);
    font-size: 12px;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    gap: 5px;
    white-space: nowrap;
  }
  .dt-btn:hover:not(:disabled) { background: var(--dt-hover); }
  .dt-btn:disabled { opacity: 0.38; cursor: default; }

  .dt-btn.primary {
    background: var(--dt-accent);
    color: var(--dt-accent-fg);
    border-color: transparent;
    font-weight: 500;
    padding: 0 12px;
  }
  .dt-btn.primary:hover:not(:disabled) { background: var(--dt-accent-hover); }

  .dt-btn.ghost {
    background: transparent;
    border-color: transparent;
    color: var(--dt-fg-muted);
    padding: 0 7px;
  }
  .dt-btn.ghost:hover:not(:disabled) { background: var(--dt-hover); color: var(--dt-fg); }
  .dt-btn.active { background: var(--dt-active); border-color: transparent; color: var(--dt-fg); }
  .dt-btn.icon-only { width: 27px; padding: 0; justify-content: center; }

  .dt-select {
    height: 27px;
    padding: 0 8px;
    border-radius: 6px;
    border: 1px solid var(--dt-border);
    background: var(--dt-surface);
    color: var(--dt-fg);
    font-family: inherit;
    font-size: 12px;
    cursor: pointer;
    outline: none;
  }
  .dt-select:hover { border-color: var(--dt-border-strong); }

  .key-hint {
    font-family: var(--dt-mono);
    font-size: 10.5px;
    color: var(--dt-fg-subtle);
  }

  .win-controls { display: inline-flex; align-items: center; margin-left: 2px; flex-shrink: 0; }
  .win-ctrl {
    width: 28px;
    height: 24px;
    border: none;
    background: transparent;
    color: var(--dt-fg-subtle);
    border-radius: 4px;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    justify-content: center;
  }
  .win-ctrl:hover { background: var(--dt-hover); color: var(--dt-fg); }
  .win-ctrl.close:hover { background: #c42b1c; color: #ffffff; }

  /* ==========================================================================
     TITLEBAR & ORDERLY TAB STRIP (Single-Row Scroll ↔ Multi-Row Grid Wrap)
     ========================================================================== */
  .dt-titlebar {
    height: 38px;
    flex-shrink: 0;
    background: var(--dt-chrome);
    border-bottom: 1px solid var(--dt-border);
    display: flex;
    align-items: center;
    padding: 0 10px;
    gap: 6px;
  }
  .dt-titlebar.thin { height: 36px; }

  .brand-mark {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-weight: 600;
    font-size: 12.5px;
    color: var(--dt-fg);
    padding-right: 4px;
    flex-shrink: 0;
  }

  /* Dedicated orderly tab container (used in Multi-Row mode for A, and always for B) */
  .tab-bar-row {
    flex-shrink: 0;
    background: var(--dt-chrome);
    border-bottom: 1px solid var(--dt-border);
    padding: 5px 10px;
    display: flex;
    align-items: flex-start;
    gap: 6px;
  }

  .h-tabs {
    flex: 1;
    min-width: 0;
    display: flex;
    align-items: center;
    gap: 4px;
  }
  .h-tabs.single-row {
    flex-wrap: nowrap;
    overflow-x: auto;
    scrollbar-width: none;
  }
  .h-tabs.single-row::-webkit-scrollbar { display: none; }

  /* Multi-row: strict grid-aligned equal-width cells, capped at ~3 rows */
  .h-tabs.multi-row {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(136px, 1fr));
    gap: 5px;
    max-height: 94px;
    overflow-y: auto;
    align-content: start;
  }

  .h-tab {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    height: 27px;
    padding: 0 9px;
    border-radius: 6px;
    background: transparent;
    color: var(--dt-fg-muted);
    cursor: pointer;
    flex-shrink: 0;
    font-size: 12px;
    position: relative;
  }
  .h-tabs.single-row .h-tab {
    min-width: 96px;
    max-width: 184px;
  }
  .h-tabs.multi-row .h-tab {
    display: flex;
    width: 100%;
    min-width: 0;
    max-width: none;
    background: var(--dt-surface);
    border: 1px solid transparent;
  }
  .h-tab:hover { background: var(--dt-hover); color: var(--dt-fg); }
  .h-tab.active {
    background: var(--dt-bg);
    color: var(--dt-fg);
    font-weight: 500;
    box-shadow: inset 0 0 0 1px var(--dt-border-strong);
  }
  .h-tab.active::before {
    content: "";
    position: absolute;
    left: 10px;
    right: 10px;
    bottom: 0;
    height: 2px;
    border-radius: 2px 2px 0 0;
    background: var(--dt-accent);
  }
  .h-tab.rich { max-width: 224px; }

  .h-tab-text {
    min-width: 0;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    display: flex;
    align-items: center;
    gap: 4px;
  }
  .h-tab-snippet {
    font-family: var(--dt-mono);
    font-size: 10.5px;
    color: var(--dt-fg-subtle);
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    max-width: 72px;
  }
  .tab-num {
    font-family: var(--dt-mono);
    font-size: 10px;
    color: var(--dt-fg-subtle);
    flex-shrink: 0;
  }
  .tab-dirty {
    width: 4px;
    height: 4px;
    border-radius: 50%;
    background: var(--dt-fg-subtle);
    flex-shrink: 0;
  }
  .tab-close {
    width: 16px;
    height: 16px;
    border: none;
    background: transparent;
    color: var(--dt-fg-subtle);
    border-radius: 4px;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    margin-left: auto;
    flex-shrink: 0;
    opacity: 0;
  }
  .h-tab:hover .tab-close, .h-tab.active .tab-close, .c-vtab:hover .tab-close, .c-vtab.active .tab-close { opacity: 0.72; }
  .tab-close:hover { opacity: 1 !important; background: var(--dt-active); color: var(--dt-fg); }

  .tab-trailing {
    display: inline-flex;
    align-items: center;
    gap: 3px;
    flex-shrink: 0;
  }

  .b-omni {
    flex: 1;
    max-width: 400px;
    margin: 0 auto;
    height: 26px;
    background: var(--dt-bg);
    border: 1px solid var(--dt-border);
    border-radius: 6px;
    padding: 0 10px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    cursor: pointer;
    color: var(--dt-fg-muted);
    font-size: 11.5px;
    min-width: 0;
  }
  .b-omni:hover { border-color: var(--dt-border-strong); color: var(--dt-fg); }

  /* ==========================================================================
     SMART DETECTION STRIP (Quiet, aligned, never noisy)
     ========================================================================== */
  .smart-banner {
    flex-shrink: 0;
    background: var(--dt-surface);
    border-bottom: 1px solid var(--dt-border);
    padding: 0 14px;
    height: 34px;
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .smart-tag {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-size: 11.5px;
    font-weight: 500;
    color: var(--dt-accent);
    white-space: nowrap;
  }
  .smart-dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--dt-accent);
    flex-shrink: 0;
  }
  .smart-preview {
    font-family: var(--dt-mono);
    font-size: 11px;
    color: var(--dt-fg-subtle);
    max-width: 240px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .smart-recs {
    display: flex;
    align-items: center;
    gap: 5px;
    margin-left: auto;
    flex-shrink: 0;
  }

  .b-smart-toast {
    position: absolute;
    right: 16px;
    bottom: 14px;
    z-index: 25;
    max-width: 350px;
    background: var(--dt-chrome);
    border: 1px solid var(--dt-border-strong);
    border-radius: 8px;
    box-shadow: 0 10px 26px rgba(0, 0, 0, 0.30);
    padding: 10px 12px;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  .c-smart-box {
    margin: 8px 8px 2px;
    padding: 9px 10px;
    border-radius: 7px;
    background: var(--dt-surface);
    border: 1px solid var(--dt-border);
    display: flex;
    flex-direction: column;
    gap: 6px;
    flex-shrink: 0;
  }

  /* ==========================================================================
     BODY SHELLS (Uniform vertical rhythm, calm alignment)
     ========================================================================== */
  .dt-body {
    flex: 1;
    min-height: 0;
    display: flex;
    position: relative;
    overflow: hidden;
  }

  .a-sidebar {
    width: 196px;
    flex-shrink: 0;
    background: var(--dt-chrome);
    border-right: 1px solid var(--dt-border);
    display: flex;
    flex-direction: column;
    overflow-y: auto;
    padding: 10px 8px;
    gap: 2px;
  }
  .a-sidebar.collapsed {
    width: 46px;
    padding: 10px 4px;
    align-items: center;
    gap: 4px;
  }

  .nav-head {
    font-size: 11px;
    font-weight: 500;
    color: var(--dt-fg-subtle);
    padding: 12px 8px 4px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  .nav-item {
    width: 100%;
    height: 30px;
    text-align: left;
    border: none;
    background: transparent;
    color: var(--dt-fg-muted);
    border-radius: 6px;
    padding: 0 8px;
    font-size: 12.5px;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .nav-item:hover { background: var(--dt-hover); color: var(--dt-fg); }
  .nav-item.active { background: var(--dt-active); color: var(--dt-fg); font-weight: 500; }
  .nav-item.smart-hit { color: var(--dt-fg); }
  .nav-name { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  .b-rail {
    width: 46px;
    flex-shrink: 0;
    background: var(--dt-chrome);
    border-right: 1px solid var(--dt-border);
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 10px 0;
    gap: 4px;
    z-index: 15;
  }
  .b-rail-btn {
    width: 32px;
    height: 32px;
    border-radius: 6px;
    border: none;
    background: transparent;
    color: var(--dt-fg-subtle);
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
  }
  .b-rail-btn:hover { background: var(--dt-hover); color: var(--dt-fg); }
  .b-rail-btn.active { background: var(--dt-active); color: var(--dt-fg); }
  .b-rail-dot { position: absolute; top: 5px; right: 5px; width: 5px; height: 5px; border-radius: 50%; background: var(--dt-accent); }

  .b-flyout {
    position: absolute;
    left: 46px;
    top: 0;
    bottom: 0;
    width: 224px;
    background: var(--dt-chrome);
    border-right: 1px solid var(--dt-border-strong);
    box-shadow: 10px 0 28px rgba(0, 0, 0, 0.25);
    z-index: 20;
    display: flex;
    flex-direction: column;
    overflow-y: auto;
    padding: 10px 8px;
    gap: 2px;
  }

  .c-column {
    width: 216px;
    flex-shrink: 0;
    background: var(--dt-chrome);
    border-right: 1px solid var(--dt-border);
    display: flex;
    flex-direction: column;
    min-height: 0;
  }
  .c-column.collapsed { width: 46px; align-items: center; padding: 10px 4px; gap: 4px; }
  .c-vtabs { padding: 8px; border-bottom: 1px solid var(--dt-border); display: flex; flex-direction: column; gap: 2px; max-height: 230px; overflow-y: auto; }
  .c-vtab {
    width: 100%;
    text-align: left;
    border: none;
    background: transparent;
    border-radius: 6px;
    padding: 6px 8px;
    cursor: pointer;
    display: flex;
    flex-direction: column;
    gap: 2px;
  }
  .c-vtab:hover { background: var(--dt-hover); }
  .c-vtab.active { background: var(--dt-active); }
  .c-vtab-top { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--dt-fg); }
  .c-vtab.active .c-vtab-top { font-weight: 500; }
  .c-vtab-sub { padding-left: 20px; font-family: var(--dt-mono); font-size: 10px; color: var(--dt-fg-subtle); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .c-catalog-tabs { display: flex; padding: 2px 10px 0; gap: 14px; border-bottom: 1px solid var(--dt-border); }
  .c-cat-tab { border: none; background: transparent; color: var(--dt-fg-subtle); font-size: 11.5px; padding: 7px 0; cursor: pointer; border-bottom: 1.5px solid transparent; }
  .c-cat-tab.active { color: var(--dt-fg); border-bottom-color: var(--dt-fg); font-weight: 500; }
  .c-catalog-list { flex: 1; min-height: 0; overflow-y: auto; padding: 8px; display: flex; flex-direction: column; gap: 1px; }

  /* ==========================================================================
     MAIN WORKSPACE — SPACIOUS, BALANCED, ONE CLEAR FOCAL POINT
     ========================================================================== */
  .dt-main {
    flex: 1;
    min-width: 0;
    min-height: 0;
    display: flex;
    flex-direction: column;
    background: var(--dt-bg);
    position: relative;
  }

  .tool-header {
    height: 44px;
    flex-shrink: 0;
    padding: 0 16px;
    border-bottom: 1px solid var(--dt-border);
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
  }
  .tool-header-left { display: flex; align-items: center; gap: 10px; min-width: 0; }
  .tool-title { font-weight: 600; font-size: 13.5px; color: var(--dt-fg); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .tool-header-right { display: flex; align-items: center; gap: 5px; flex-shrink: 0; position: relative; }

  .tool-canvas { flex: 1; min-height: 0; display: flex; overflow: hidden; }
  .tool-canvas.split-h { flex-direction: row; }
  .tool-canvas.split-v { flex-direction: column; }
  .tool-canvas.single { flex-direction: column; }

  .pane { min-width: 0; min-height: 0; display: flex; flex-direction: column; background: var(--dt-bg); overflow: hidden; }
  .pane-label-row {
    height: 32px;
    flex-shrink: 0;
    padding: 0 14px 0 16px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    font-size: 11.5px;
    color: var(--dt-fg-subtle);
  }
  .pane-mini-actions { display: inline-flex; align-items: center; gap: 4px; }
  .text-link {
    border: none;
    background: transparent;
    color: var(--dt-fg-subtle);
    font-size: 11.5px;
    padding: 2px 6px;
    border-radius: 4px;
    cursor: pointer;
  }
  .text-link:hover { color: var(--dt-fg); background: var(--dt-hover); }

  .code-wrap { flex: 1; min-height: 0; display: flex; overflow: hidden; }
  .line-gutter {
    width: 38px;
    flex-shrink: 0;
    padding: 4px 12px 16px 0;
    text-align: right;
    font-family: var(--dt-mono);

  const TOOL_MAP = Object.fromEntries(TOOLS.map(t => [t.id, t]));

  const CLIPBOARD_PRESETS = [
    { id: "jwt", label: "JWT Token（脱敏预览）", kind: "Text", concealed: false, text: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJzdWIiOiJ1c2VyXzk5IiwibmFtZSI6Ik5lYWwiLCJzY29wZSI6ImRldnRvb2xzOnYxIiwiZXhwIjoxODkzNDU2MDAwfQ.SflKxwRJSMeKKF2QT4fwpMeJf36POk6yJV_adQssw5c" },

  function b64DecodeUtf8(str) {
    try {
      let s = str.trim().replace(/-/g, "+").replace(/_/g, "/");
      while (s.length % 4) s += "=";
      const bin = atob(s);
      const bytes = Uint8Array.from(bin, c => c.charCodeAt(0));
      return { ok: true, value: new TextDecoder("utf-8", { fatal: true }).decode(bytes) };
    } catch { return { ok: false, value: "" }; }
  }
  function b64EncodeUtf8(str) {
    const bytes = new TextEncoder().encode(str);
    let bin = "";
    bytes.forEach(b => (bin += String.fromCharCode(b)));
    return btoa(bin);
  }
  function redactPreview(dataType, raw) {
    const oneLine = raw.replace(/\s+/g, " ").trim();
    if (dataType === "Jwt") {
      const p = oneLine.split(".");
      return `${p[0].slice(0, 12)}… . ${p[1].slice(0, 10)}… . [redacted]`;
    }
    if (dataType === "Url") return oneLine.replace(/((?:token|api_key|key|secret|password|auth)=)([^&]+)/gi, "$1••••");
    return oneLine.length > 44 ? oneLine.slice(0, 44) + "…" : oneLine;
  }

  function runSmartDetection(clipboard, opts = {}) {
    const { mode = "strict", excludeToolId = null, favorites = [], recents = [] } = opts;
    if (!clipboard || (!clipboard.text && !clipboard.concealed)) return { skipped: true, reason: "剪贴板为空", matches: [], suppressed: [], recommendations: [] };
    if (clipboard.concealed) return { skipped: true, guard: "PASSWORD_MANAGER_ZERO_READ", reason: `命中密码管理器隐藏标记（${clipboard.concealedTag || "ConcealedType"}），零读取跳过`, matches: [], suppressed: [], recommendations: [] };

    const raw = (clipboard.text || "").trim();
    if (!raw) return { skipped: true, reason: "剪贴板为空白文本", matches: [], suppressed: [], recommendations: [] };
    if (/-----BEGIN [A-Z0-9 ]*PRIVATE KEY-----/.test(raw) || /^(ghp_|github_pat_|AKIA[0-9A-Z]{16}|sk-[A-Za-z0-9]{12,})/.test(raw)) {
      return { skipped: true, guard: "SENSITIVE_CREDENTIAL_BLOCK", reason: "命中高危私钥 / 云凭据启发式保护，已静默拦截", matches: [], suppressed: [], recommendations: [] };
    }

    const hits = [], suppressed = [];
    if (/^[A-Za-z0-9_-]{8,}\.[A-Za-z0-9_-]{8,}\.[A-Za-z0-9_-]{6,}$/.test(raw)) {
      const h = b64DecodeUtf8(raw.split(".")[0]), p = b64DecodeUtf8(raw.split(".")[1]);
      if (h.ok && p.ok && h.value.startsWith("{") && p.value.startsWith("{")) {
        hits.push({ type: "Jwt", label: "JWT", confidence: 100, level: "Exact", specificity: 95, tools: [{ toolId: "jwt-debugger", autoMode: "解析验签" }] });
      }
    }
    if (/-----BEGIN CERTIFICATE-----/.test(raw)) hits.push({ type: "CertificatePem", label: "X.509 证书", confidence: 100, level: "Exact", specificity: 94, tools: [{ toolId: "x509-decoder", autoMode: "PEM 解析" }] });
    if (/^H4sI[A-Za-z0-9+/=]{8,}$/.test(raw)) hits.push({ type: "GZipBase64", label: "GZip Base64", confidence: 100, level: "Exact", specificity: 92, tools: [{ toolId: "gzip", autoMode: "解压" }] });
    if ((raw.startsWith("{") && raw.endsWith("}")) || (raw.startsWith("[") && raw.endsWith("]"))) {
      try {
        const parsed = JSON.parse(raw);
        if (Array.isArray(parsed) && parsed.length > 0 && typeof parsed[0] === "object" && parsed[0] !== null) {
          hits.push({ type: "JsonArray", parent: "Json", label: "JSON 数组", confidence: 100, level: "Exact", specificity: 90, tools: [
            { toolId: "json-to-table", autoMode: "交互表格" },
            { toolId: "json-formatter", autoMode: "美化 · 2 空格" },
            { toolId: "jsonpath-tester", autoMode: "$.[*].name" }
          ] });
        } else if (typeof parsed === "object" && parsed !== null) {
          hits.push({ type: "Json", label: "JSON", confidence: 75, level: "High", specificity: 80, tools: [
            { toolId: "json-formatter", autoMode: "美化 · 2 空格" },
            { toolId: "jsonpath-tester", autoMode: "$.[*].name" },
            { toolId: "data-converter", autoMode: "JSON → YAML" }
          ] });
        }
      } catch {}
    }
    if (/^https?:\/\/[^\s]+$/i.test(raw)) hits.push({ type: "Url", label: "URL", confidence: 100, level: "Exact", specificity: 88, tools: [{ toolId: "url-parser", autoMode: "解析拆解" }] });
    if (/^\d{10}$/.test(raw) || /^\d{13}$/.test(raw)) {
      const sec = raw.length === 13 ? Number(raw) / 1000 : Number(raw);
      if (sec >= 157766400 && sec <= 4102444800) hits.push({ type: "UnixTimestamp", label: "时间戳", confidence: 75, level: "High", specificity: 78, tools: [{ toolId: "timestamp", autoMode: "时间戳 → 日期" }] });
    }
    if (raw.length >= 8 && /^[A-Za-z0-9+/_-]+=*$/.test(raw) && !/^\d+$/.test(raw) && !/^[a-zA-Z]{1,14}$/.test(raw)) {
      const dec = b64DecodeUtf8(raw);
      if (dec.ok && /^[\x09\x0A\x0D\x20-\x7E\u4e00-\u9fff]+$/.test(dec.value)) {
        hits.push({ type: "Base64Text", label: "Base64", confidence: 50, level: "Medium", specificity: 45, tools: [{ toolId: "base64", autoMode: "解码" }] });
      }
    }

    const types = new Set(hits.map(h => h.type));
    const finalHits = hits.filter(h => {
      if (h.type === "Base64Text" && (types.has("Jwt") || types.has("GZipBase64") || types.has("CertificatePem") || types.has("Url"))) {
        suppressed.push("压制 Base64Text");
        return false;
      }
      return true;
    });

    const recMap = new Map();
    finalHits.sort((a, b) => (b.confidence - a.confidence) || (b.specificity - a.specificity));
    for (const h of finalHits) {
      for (const t of h.tools) {
        if (t.toolId === excludeToolId) continue;
        if (!recMap.has(t.toolId)) {
          const boost = (favorites.includes(t.toolId) ? 2 : 0) + (recents.includes(t.toolId) ? 1 : 0);
          recMap.set(t.toolId, { toolId: t.toolId, autoMode: t.autoMode, dataType: h.type, dataLabel: h.label, confidence: h.confidence, level: h.level, score: h.confidence * 100 + h.specificity + boost });
        }
      }
    }
    if (mode === "relay") {
      for (const fb of [{ toolId: "base64", autoMode: "编码", dataType: "Text", dataLabel: "纯文本", confidence: 25, level: "Low" }, { toolId: "hash-checksum", autoMode: "文本摘要", dataType: "Text", dataLabel: "纯文本", confidence: 25, level: "Low" }]) {
        if (fb.toolId !== excludeToolId && !recMap.has(fb.toolId)) recMap.set(fb.toolId, { ...fb, score: 2500 });
      }
    }

    const recommendations = Array.from(recMap.values()).sort((a, b) => b.score - a.score);
    const primaryHit = finalHits[0] || null;
    return {
      skipped: false,
      primaryType: primaryHit?.type || null,
      primaryLabel: primaryHit?.label || null,
      primaryLevel: primaryHit?.level || null,
      redactedPreview: primaryHit ? redactPreview(primaryHit.type, raw) : raw.slice(0, 40),
      matches: finalHits,
      suppressed,
      recommendations
    };
  }

  function fuzzyScore(query, tool) {
    const q = query.trim().toLowerCase();
    if (!q) return 1;
    const fields = [
      { text: tool.name.toLowerCase(), weight: 100 },
      { text: tool.en.toLowerCase(), weight: 85 },
      ...tool.aliases.map(a => ({ text: a.toLowerCase(), weight: 80 })),
      { text: (CATEGORIES.find(c => c.id === tool.cat)?.name || "").toLowerCase(), weight: 40 }
    ];
    let best = 0;
    for (const f of fields) {
      if (f.text === q) best = Math.max(best, f.weight + 60);
      else if (f.text.startsWith(q)) best = Math.max(best, f.weight + 40);
      else if (f.text.includes(q)) best = Math.max(best, f.weight + 20);
      else {
        let qi = 0;
        for (let i = 0; i < f.text.length && qi < q.length; i++) if (f.text[i] === q[qi]) qi++;
        if (qi === q.length) best = Math.max(best, f.weight);
      }
    }
    return best;
  }

  function computeToolOutput(toolId, mode, input) {
    const text = (input || "").trim();
    if (!text) return { text: "", kind: "text", status: "等待输入" };
    try {
      if (toolId === "json-formatter") {
        const obj = JSON.parse(text);
        if (mode.includes("压缩")) return { text: JSON.stringify(obj), kind: "json", status: "JSON 有效 · 压缩" };
        if (mode.includes("键排序")) {
          const sortObj = v => Array.isArray(v) ? v.map(sortObj) : (v && typeof v === "object" ? Object.fromEntries(Object.keys(v).sort().map(k => [k, sortObj(v[k])])) : v);
          return { text: JSON.stringify(sortObj(obj), null, 2), kind: "json", status: "JSON 有效 · 键排序" };
        }
        const spaces = mode.includes("4") ? 4 : 2;
        return { text: JSON.stringify(obj, null, spaces), kind: "json", status: `JSON 有效 · ${spaces} 空格` };
      }
      if (toolId === "json-to-table") {
        const arr = JSON.parse(text);
        if (!Array.isArray(arr) || !arr.length || typeof arr[0] !== "object") return { text: "请输入非空 JSON 对象数组", kind: "error", status: "格式不匹配" };
        const cols = Array.from(new Set(arr.flatMap(r => Object.keys(r || {}))));
        const csvLines = [cols.join(","), ...arr.map(r => cols.map(c => JSON.stringify(r?.[c] ?? "")).join(","))];
        if (mode === "导出 CSV") return { text: csvLines.join("\n"), kind: "text", status: `${arr.length} 行 × ${cols.length} 列 · CSV` };
        return { text: csvLines.join("\n"), kind: "table", columns: cols, rows: arr, status: `${arr.length} 行 × ${cols.length} 列` };
      }
      if (toolId === "jwt-debugger") {
        const parts = text.split(".");
        if (parts.length !== 3) return { text: "非标准 3 段 JWT", kind: "error", status: "解析失败" };
        const h = b64DecodeUtf8(parts[0]), p = b64DecodeUtf8(parts[1]);
        if (!h.ok || !p.ok) return { text: "Base64URL 解码失败", kind: "error", status: "解码错误" };
        const payloadObj = JSON.parse(p.value), headerObj = JSON.parse(h.value);
        const expText = payloadObj.exp ? new Date(payloadObj.exp * 1000).toISOString().slice(0, 19) + "Z" : "无 exp";
        const prettyPayload = JSON.stringify(payloadObj, null, 2);
        return { text: prettyPayload, kind: "jwt", header: JSON.stringify(headerObj, null, 2), payload: prettyPayload, expText, status: `${headerObj.alg || "?"} · exp ${expText}` };
      }
      if (toolId === "base64") {
        if (mode.includes("解码") || mode.includes("URL-Safe")) {
          const dec = b64DecodeUtf8(text);
          return dec.ok ? { text: dec.value, kind: dec.value.trim().startsWith("{") ? "json" : "text", status: `UTF-8 解码 · ${dec.value.length} chars` } : { text: "非法 UTF-8 Base64", kind: "error", status: "解码失败" };
        }
        const enc = b64EncodeUtf8(text);
        return { text: enc, kind: "text", status: `Base64 编码 · ${enc.length} chars` };
      }
      if (toolId === "url-parser") {
        if (mode === "URL 编码") return { text: encodeURIComponent(text), kind: "text", status: "URL 编码" };
        if (mode === "URL 解码") return { text: decodeURIComponent(text), kind: "text", status: "URL 解码" };
        const u = new URL(text);
        const rows = [{ 字段: "Protocol", 值: u.protocol }, { 字段: "Host", 值: u.host }, { 字段: "Path", 值: u.pathname }, ...Array.from(u.searchParams.entries()).map(([k, v]) => ({ 字段: `Query: ${k}`, 值: v }))];
        return { text: JSON.stringify({ protocol: u.protocol, host: u.host, path: u.pathname, params: Object.fromEntries(u.searchParams.entries()) }, null, 2), kind: "table", columns: ["字段", "值"], rows, status: `${u.searchParams.size} 个 Query 参数` };
      }
      if (toolId === "timestamp") {
        if (/^\d{10,13}$/.test(text)) {
          const ms = text.length === 13 ? Number(text) : Number(text) * 1000;
          const d = new Date(ms);
          return { text: `UTC   : ${d.toISOString()}\nLocal : ${d.toLocaleString("zh-CN")}\nUnix  : ${Math.floor(ms / 1000)}`, kind: "text", status: "已转换" };
        }
        const parsed = Date.parse(text);
        if (!Number.isNaN(parsed)) return { text: `Unix (s)  : ${Math.floor(parsed / 1000)}\nUnix (ms) : ${parsed}`, kind: "text", status: "已转换" };
        return { text: "无法识别日期或时间戳", kind: "error", status: "解析失败" };
      }
      return { text, kind: "text", status: mode };
    } catch (e) {
      return { text: `SyntaxError: ${e.message}`, kind: "error", status: "语法异常" };
    }
  }

  function createInitialState(variantId = "AB") {
    const initialClip = CLIPBOARD_PRESETS[0];
    const initialFavorites = ["json-formatter", "jwt-debugger", "base64", "url-parser", "timestamp"];
    const initialRecents = ["json-formatter", "base64", "url-parser"];
    const detection = runSmartDetection(initialClip, { mode: "strict", favorites: initialFavorites, recents: initialRecents });
    const collapsedCats = Object.fromEntries(CATEGORIES.map(c => [c.id, true]));
    const prefersLight = typeof window !== "undefined" && window.matchMedia && window.matchMedia("(prefers-color-scheme: light)").matches;
    return {
      variant: variantId,
      dtTheme: prefersLight ? "light" : "dark",
      windowSize: "fluid",

    if (qStr) return colon ? `<span class="syn-k">${qStr}</span>${colon}` : `<span class="syn-s">${qStr}</span>`;
    if (bool) return `<span class="syn-b">${m}</span>`;
    return `<span class="syn-n">${m}</span>`;
  });
}
function renderGutter(text) { return Array.from({ length: Math.max(1, (text || "").split("\n").length) }, (_, i) => i + 1).join("<br>"); }
function getSmartHitSet(st) { return (!st.smartResult || st.smartResult.skipped) ? new Set() : new Set(st.smartResult.recommendations.map(r => r.toolId)); }
function isSmartBannerVisible(st) { return st.residency === "Active" && st.smartResult && !st.smartResult.skipped && st.smartResult.recommendations.length > 0 && st.dismissedClipSeq !== st.clipboard.seq; }
function getDuplicateToolSet(st) { const c = {}; st.tabs.forEach(t => (c[t.toolId] = (c[t.toolId] || 0) + 1)); return new Set(Object.keys(c).filter(k => c[k] > 1)); }
function tabSnippet(tab) { const c = (tab.input || "").replace(/\s+/g, " ").trim(); return !c ? "空" : (c.length > 18 ? c.slice(0, 18) + "…" : c); }

function getPaletteItems(st) {
  const q = st.paletteQuery.trim(), items = [];
  if (!q) {
    if (st.smartResult && !st.smartResult.skipped) {
      for (const r of st.smartResult.recommendations.slice(0, 5)) items.push({ group: `智能识别 · ${r.dataLabel}`, tool: DevToolsCore.TOOL_MAP[r.toolId], smartRec: r });
    }
    for (const id of st.recents) if (!items.some(i => i.tool.id === id)) items.push({ group: "最近使用", tool: DevToolsCore.TOOL_MAP[id] });
    for (const id of st.favorites) if (!items.some(i => i.tool.id === id)) items.push({ group: "收藏", tool: DevToolsCore.TOOL_MAP[id] });
    return items;
  }
  const smartMap = new Map((st.smartResult?.recommendations || []).map(r => [r.toolId, r]));
  return DevToolsCore.TOOLS.map(tool => ({ tool, score: DevToolsCore.fuzzyScore(q, tool) })).filter(x => x.score > 0).sort((a, b) => b.score - a.score).slice(0, 10).map(x => ({ group: "匹配工具", tool: x.tool, smartRec: smartMap.get(x.tool.id) || null }));
}

function renderSmartRecButtons(st, max = 2) {

function renderOutputBody(res) {
  if (res.kind === "table") {
    return `<table class="mini-table"><thead><tr>${res.columns.map(c => `<th>${escHtml(c)}</th>`).join("")}</tr></thead><tbody>${res.rows.map(r => `<tr>${res.columns.map(c => `<td>${escHtml(r[c] ?? "")}</td>`).join("")}</tr>`).join("")}</tbody></table>`;
  }
  if (res.kind === "jwt") {
    return `<div style="display:flex;flex-direction:column;gap:12px;"><div><div style="font-size:10.5px;color:var(--dt-fg-subtle);margin-bottom:4px;">HEADER</div><div>${highlightJson(res.header)}</div></div><div style="border-top:1px solid var(--dt-border);padding-top:10px;"><div style="font-size:10.5px;color:var(--dt-fg-subtle);margin-bottom:4px;">PAYLOAD</div><div>${highlightJson(res.payload)}</div></div></div>`;
  }
  if (res.kind === "error") return `<div style="color:var(--dt-err);">${escHtml(res.text)}</div>`;
  if (res.kind === "json") return highlightJson(res.text);
  return escHtml(res.text || "");
}

function renderToolView(st, tab) {
  const tool = DevToolsCore.TOOL_MAP[tab.toolId];
  const dups = getDuplicateToolSet(st);
  const isFav = st.favorites.includes(tool.id);
  const res = DevToolsCore.computeToolOutput(tool.id, tab.mode, tab.input);
  const relayDetection = res.text && res.kind !== "error"
    ? DevToolsCore.runSmartDetection({ kind: "Text", text: res.text, concealed: false }, { mode: "relay", excludeToolId: tool.id, favorites: st.favorites, recents: st.recents })
    : { recommendations: [] };

  const layout = tab.layout || "split-h";
  const layoutIcon = layout === "split-h" ? "splitH" : layout === "split-v" ? "splitV" : "single";
  const ratio = tab.splitRatio || 48;
  const pane1Style = layout === "single" ? "flex:1;" : `flex: 0 0 calc(${ratio}% - 1px);`;
  const pane2Style = layout === "single" ? "flex:1;" : `flex: 1 1 0;`;
  const showOutGutter = res.kind === "json" || res.kind === "text";

  return `
    <div class="tool-header">
      <div class="tool-header-left">
        <span class="tool-title">${escHtml(tool.name)}${dups.has(tool.id) ? ` <span class="tab-num">#${tab.instanceNum}</span>` : ""}</span>
        <select class="dt-select" id="tool-mode-select" data-tab="${tab.id}" title="运行模式">
          ${tool.modes.map(m => `<option value="${escHtml(m)}" ${tab.mode === m ? "selected" : ""}>${escHtml(m)}</option>`).join("")}
        </select>
      </div>
      <div class="tool-header-right">
        <button class="dt-btn ghost icon-only" data-action="cycle-layout" data-tab="${tab.id}" title="切换分栏方向（左右 / 上下 / 单栏）">${icon(layoutIcon, true)}</button>
        <button class="dt-btn ghost icon-only" data-action="dup-tool" data-tool="${tool.id}" title="多开独立实例">${icon("plus", true)}</button>
        <button class="dt-btn ghost icon-only" data-action="toggle-fav" data-tool="${tool.id}" title="${isFav ? "取消收藏" : "收藏"}" style="${isFav ? "color:var(--dt-warn);" : ""}">${icon("star", true)}</button>
        <button class="dt-btn ghost ${st.relayMenuOpen ? "active" : ""}" data-action="toggle-relay" ${!res.text || res.kind === "error" ? "disabled" : ""} title="工具接力（单跳传递至兼容工具）">${icon("send", true)}发送到</button>
        <button class="dt-btn primary" data-action="copy-dismiss" ${!res.text ? "disabled" : ""} title="复制结果并立刻收起到托盘">复制并收起</button>
        ${st.relayMenuOpen ? `
          <div class="relay-menu">
            <div class="relay-header">工具接力（单跳传递）</div>
            ${relayDetection.recommendations.slice(0, 5).map(r => {
              const rt = DevToolsCore.TOOL_MAP[r.toolId];
              return `<button class="nav-item" data-action="relay-send" data-tool="${rt.id}" data-mode="${escHtml(r.autoMode)}">${icon(rt.icon, true)}<span class="nav-name">${escHtml(rt.name)}</span><span class="key-hint">${escHtml(r.dataLabel)}</span></button>`;
            }).join("")}
          </div>
        ` : ""}
      </div>
    </div>

    <div class="tool-canvas ${layout}" data-canvas-tab="${tab.id}">
      <div class="pane" style="${pane1Style}">
        <div class="pane-label-row">
          <span>输入</span>
          <span class="pane-mini-actions">
            <button class="text-link" data-action="fill-sample" data-tab="${tab.id}">示例</button>
            <button class="text-link" data-action="clear-input" data-tab="${tab.id}">清空</button>
          </span>
        </div>
        <div class="code-wrap">
          <div class="line-gutter">${renderGutter(tab.input)}</div>
          <textarea class="pane-editor" id="active-tool-input" data-tab="${tab.id}" spellcheck="false" placeholder="输入或粘贴内容…">${escHtml(tab.input)}</textarea>
        </div>
      </div>

      ${layout !== "single" ? `<div class="split-handle" data-split-handle="${tab.id}" title="拖拽调整比例"></div>` : ""}

      <div class="pane" style="${pane2Style}">
        <div class="pane-label-row">
          <span>输出${tool.sensitiveOutput ? " · 敏感" : ""}</span>
          <span class="pane-mini-actions">
            <button class="text-link" data-action="copy-out" ${!res.text ? "disabled" : ""}>复制</button>
          </span>
        </div>
        <div class="code-wrap">
          ${showOutGutter && res.text ? `<div class="line-gutter">${renderGutter(res.text)}</div>` : ""}
          <div class="pane-output">${renderOutputBody(res)}</div>
        </div>
      </div>
    </div>

    <div class="dt-footer">
      <span class="footer-ok"><span class="ok-dot ${res.kind === "error" ? "err" : ""}"></span>${escHtml(res.status)} · ${tab.input.length} chars</span>
      <span>${tool.sensitiveOutput ? "纯离线 · 复制排除历史" : "纯离线 · 仅内存态"}</span>
    </div>
  `;
}

function renderPalette(st) {
  if (!st.paletteOpen) return "";
  const items = getPaletteItems(st);
  const clampedIdx = items.length ? Math.min(st.paletteIndex, items.length - 1) : 0;
  let lastGroup = "";
  return `
    <div class="palette-backdrop" data-action="close-palette-bg">
      <div class="palette-modal">
        <div class="palette-input-row">${icon("search")}<input id="palette-input" type="text" value="${escHtml(st.paletteQuery)}" placeholder="搜索工具（中文 / 英文 / b64 / jwt / ts）…" /><span class="key-hint">Esc</span></div>
        <div class="palette-list">
          ${items.length === 0 ? `<div style="padding:18px;text-align:center;color:var(--dt-fg-subtle);">无匹配工具</div>` : items.map((item, i) => {
            let g = "";
            if (item.group !== lastGroup) { lastGroup = item.group; g = `<div class="palette-group">${escHtml(item.group)}</div>`; }
            return g + `<button class="palette-item ${i === clampedIdx ? "selected" : ""}" data-action="palette-pick" data-idx="${i}">
              <span style="display:flex;align-items:center;gap:8px;">${icon(item.tool.icon, true)}<span>${escHtml(item.tool.name)}</span><span style="font-size:11px;color:var(--dt-fg-subtle);">${escHtml(item.tool.en)}</span></span>
              ${item.smartRec ? `<span class="smart-tag" style="font-size:10.5px;"><span class="smart-dot"></span>带入 ${escHtml(item.smartRec.dataLabel)}</span>` : ""}
            </button>`;
          }).join("")}
        </div>
        <div class="palette-footer"><span>↑↓ 选择 · Enter 打开 · Ctrl+Enter 多开</span><span>28 个离线工具</span></div>
      </div>
    </div>
  `;
}

        </div>
        <span class="eval-summary">${residencyShort} · ${st.tabs.length} 标签 · ${sr.skipped ? "智能识别跳过" : `${sr.primaryLabel} (${sr.primaryLevel})`} · ${st.keySteps} 步</span>

            <div class="kv-item"><span class="kv-k">已开标签页（${st.tabWrap === "wrap" ? "多行" : "单行"}）</span><span class="kv-v">${st.tabs.length ? st.tabs.map(t => `${DevToolsCore.TOOL_MAP[t.toolId].name}#${t.instanceNum}`).join(", ") : "无（首页）"}</span></div>
            <div class="kv-item"><span class="kv-k">智能识别结论</span><span class="kv-v">${sr.skipped ? escHtml(sr.reason) : `${sr.primaryLabel} → ${sr.recommendations.slice(0, 2).map(r => DevToolsCore.TOOL_MAP[r.toolId].name).join(" / ")}`}</span></div>

function render() {
  const activeElId = document.activeElement?.id || null;
  const selStart = document.activeElement?.selectionStart;
  const selEnd = document.activeElement?.selectionEnd;
  const curVariant = DevToolsCore.VARIANTS.find(v => v.id === state.variant) || DevToolsCore.VARIANTS[0];

  document.getElementById("app").innerHTML = `
    <div class="sim-bar">
      <div class="sim-group">
        <span class="sim-label">剪贴板</span>
        <select class="sim-select" id="clip-preset-select">
          ${DevToolsCore.CLIPBOARD_PRESETS.map(p => `<option value="${p.id}" ${state.clipboard.id === p.id ? "selected" : ""}>${escHtml(p.label)}</option>`).join("")}
        </select>
        <button class="sim-btn ${state.residency !== "Active" ? "active" : ""}" data-action="smart-toggle">${icon("tray", true)}${state.residency === "Active" ? "收起到托盘" : "热键唤起"}</button>
        <button class="sim-btn" data-action="open-palette">${icon("command", true)}Ctrl+K</button>
      </div>
      <div class="sim-group">
        <div class="sim-seg" title="横向页签排列方式（A / B 生效）">
          <button class="${state.tabWrap === "wrap" ? "active" : ""}" data-action="set-tab-wrap" data-wrap="wrap">多行页签</button>
          <button class="${state.tabWrap === "single" ? "active" : ""}" data-action="set-tab-wrap" data-wrap="single">单行页签</button>
        </div>
        <div class="sim-seg" title="外观主题">
          <button class="${state.dtTheme === "dark" ? "active" : ""}" data-action="set-theme" data-theme="dark">Dark</button>
          <button class="${state.dtTheme === "light" ? "active" : ""}" data-action="set-theme" data-theme="light">Light</button>
        </div>
        <div class="sim-seg" title="窗口宽度">
          <button class="${state.windowSize === "fluid" ? "active" : ""}" data-action="set-size" data-size="fluid">自适应</button>
          <button class="${state.windowSize === "desktop" ? "active" : ""}" data-action="set-size" data-size="desktop">1160</button>
          <button class="${state.windowSize === "compact" ? "active" : ""}" data-action="set-size" data-size="compact">820</button>
        </div>
      </div>
    </div>

    <div class="window-stage">
      <div class="window-frame-holder" data-size="${state.windowSize}">
        <div class="dt-window" data-dt-theme="${state.dtTheme}">
          ${state.residency !== "Active"
            ? renderStandbyView(state)
            : (state.variant === "AB" ? renderVariantAB(state) : state.variant === "A" ? renderVariantA(state) : state.variant === "B" ? renderVariantB(state) : renderVariantC(state))
          }
          ${renderPalette(state)}
          ${state.toast ? `<div class="dt-toast">${escHtml(state.toast)}</div>` : ""}
        </div>
      </div>
    </div>

    <div class="bottom-row">
      <div class="variant-switcher" role="toolbar" aria-label="布局方案切换">
        <button class="sw-arrow" data-action="prev-variant" title="上一方案 (←)">${icon("chevLeft", true)}</button>
        <span class="sw-label">方案 ${curVariant.id} · ${escHtml(curVariant.name)}</span>
        <button class="sw-arrow" data-action="next-variant" title="下一方案 (→)">${icon("chevRight", true)}</button>
        <span class="sw-pills">
          ${DevToolsCore.VARIANTS.map(v => `<button class="sw-pill ${v.id === state.variant ? "active" : ""}" data-action="set-variant" data-variant="${v.id}">${v.id}</button>`).join("")}
        </span>
      </div>
      <span class="eval-summary">${escHtml(state.lastTransition)}</span>

    ${renderEvalDrawer(state)}
  `;

  if (state.paletteOpen) {
    const pi = document.getElementById("palette-input");
    if (pi) { pi.focus(); pi.setSelectionRange(pi.value.length, pi.value.length); }
  } else if (activeElId === "active-tool-input" || activeElId === "home-search-input") {
    const el = document.getElementById(activeElId);
    if (el) { el.focus(); if (typeof selStart === "number") el.setSelectionRange(selStart, selEnd); }
  }
}

document.getElementById("app").addEventListener("click", e => {
  const target = e.target.closest("[data-action]");
  if (!target) return;
  const act = target.dataset.action;

  if (act === "close-tab") { e.stopPropagation(); dispatch({ type: "CLOSE_TAB", tabId: target.dataset.tab }); return; }
  if (act === "select-tab") { dispatch({ type: "SELECT_TAB", tabId: target.dataset.tab }); return; }
  if (act === "open-tool") { dispatch({ type: "OPEN_TOOL", toolId: target.dataset.tool, forceNew: e.ctrlKey || e.metaKey }); return; }
  if (act === "dup-tool") { dispatch({ type: "OPEN_TOOL", toolId: target.dataset.tool, forceNew: true }); return; }
  if (act === "smart-open") { dispatch({ type: "OPEN_TOOL", toolId: target.dataset.tool, payload: state.clipboard.text, autoMode: target.dataset.mode, source: "smart" }); return; }
  if (act === "relay-send") {
    const tab = state.tabs.find(t => t.id === state.activeTabId);
    const out = tab ? DevToolsCore.computeToolOutput(tab.toolId, tab.mode, tab.input).text : "";
    dispatch({ type: "OPEN_TOOL", toolId: target.dataset.tool, payload: out, autoMode: target.dataset.mode, source: "relay" });
    return;
  }
  if (act === "go-home") { dispatch({ type: "SELECT_TAB", tabId: null }); return; }
  if (act === "toggle-sidebar") { dispatch({ type: "TOGGLE_SIDEBAR" }); return; }
  if (act === "toggle-cat") { dispatch({ type: "TOGGLE_CAT", catId: target.dataset.cat }); return; }
  if (act === "set-flyout") { dispatch({ type: "SET_FLYOUT", catId: target.dataset.cat || null }); return; }
  if (act === "set-c-tab") { dispatch({ type: "SET_C_CATALOG_TAB", tab: target.dataset.ctab }); return; }
  if (act === "cycle-layout") { dispatch({ type: "CYCLE_TAB_LAYOUT", tabId: target.dataset.tab }); return; }
  if (act === "toggle-fav") { dispatch({ type: "TOGGLE_FAVORITE", toolId: target.dataset.tool }); return; }
  if (act === "fill-sample") { const tab = state.tabs.find(t => t.id === target.dataset.tab); if (tab) dispatch({ type: "UPDATE_TAB_INPUT", tabId: tab.id, input: DevToolsCore.TOOL_MAP[tab.toolId].sample }); return; }
  if (act === "clear-input") { dispatch({ type: "UPDATE_TAB_INPUT", tabId: target.dataset.tab, input: "" }); return; }
  if (act === "open-palette") { dispatch({ type: "OPEN_PALETTE" }); return; }
  if (act === "wake-palette") { dispatch({ type: "SMART_TOGGLE", openPalette: true }); return; }
  if (act === "close-palette-bg" && e.target === target) { dispatch({ type: "HANDLE_ESC" }); return; }
  if (act === "palette-pick") {
    const item = getPaletteItems(state)[Number(target.dataset.idx)];
    if (item) dispatch({ type: "OPEN_TOOL", toolId: item.tool.id, payload: item.smartRec ? state.clipboard.text : null, autoMode: item.smartRec ? item.smartRec.autoMode : null, forceNew: e.ctrlKey || e.metaKey, source: item.smartRec ? "smart" : "palette" });
    return;
  }
  if (act === "toggle-relay") { dispatch({ type: "TOGGLE_RELAY_MENU" }); return; }
  if (act === "copy-out" || act === "copy-dismiss") {
    const tab = state.tabs.find(t => t.id === state.activeTabId);
    const out = tab ? DevToolsCore.computeToolOutput(tab.toolId, tab.mode, tab.input).text : "";
    if (out) { try { navigator.clipboard?.writeText(out); } catch {} dispatch({ type: "COPY_OUTPUT", text: out, andDismiss: act === "copy-dismiss" }); }
    return;
  }
  if (act === "smart-toggle") { dispatch({ type: "SMART_TOGGLE" }); return; }
  if (act === "advance-deep") { dispatch({ type: "ADVANCE_DEEP_SLEEP" }); return; }
  if (act === "explicit-paste") { dispatch({ type: "EXPLICIT_SMART_PASTE" }); return; }
  if (act === "dismiss-banner") { dispatch({ type: "DISMISS_SMART_BANNER" }); return; }
  if (act === "handle-esc") { dispatch({ type: "HANDLE_ESC" }); return; }
  if (act === "set-theme") { dispatch({ type: "SET_DT_THEME", theme: target.dataset.theme }); return; }
  if (act === "set-size") { dispatch({ type: "SET_WINDOW_SIZE", size: target.dataset.size }); return; }
  if (act === "set-tab-wrap") { dispatch({ type: "SET_TAB_WRAP", mode: target.dataset.wrap }); return; }
  if (act === "toggle-tab-wrap") { dispatch({ type: "TOGGLE_TAB_WRAP" }); return; }
  if (act === "set-eval-tab") { dispatch({ type: "SET_EVAL_TAB", tab: target.dataset.etab }); return; }
  if (act === "toggle-size") { dispatch({ type: "SET_WINDOW_SIZE", size: state.windowSize === "compact" ? "desktop" : "compact" }); return; }
  if (act === "toast-min") { state = { ...state, toast: "系统原生最小化到任务栏 / Dock" }; render(); return; }
  if (act === "set-variant") { dispatch({ type: "SET_VARIANT", variant: target.dataset.variant }); return; }
  if (act === "prev-variant" || act === "next-variant") {
    const ids = DevToolsCore.VARIANTS.map(v => v.id);
    dispatch({ type: "SET_VARIANT", variant: ids[(ids.indexOf(state.variant) + (act === "next-variant" ? 1 : ids.length - 1)) % ids.length] });
    return;
  }
  if (act === "pick-scenario") { const i = Number(target.dataset.idx); dispatch({ type: "RESET_FOR_SCENARIO", scenarioIndex: i, patch: SCENARIOS[i].setup() }); return; }
  if (act === "reset-scenario") { const i = state.activeScenario; dispatch({ type: "RESET_FOR_SCENARIO", scenarioIndex: i, patch: SCENARIOS[i].setup() }); return; }
  if (act === "run-step") {
    const stepIdx = Number(target.dataset.step), sc = SCENARIOS[state.activeScenario];
    if (sc && sc.steps[stepIdx]) {
      if (stepIdx === 0 && !state.scenarioInitialized) dispatch({ type: "RESET_FOR_SCENARIO", scenarioIndex: state.activeScenario, patch: sc.setup() });
      sc.steps[stepIdx].run(dispatch, state);
      dispatch({ type: "SET_SCENARIO_STEP", step: Math.max(state.scenarioStep, stepIdx + 1) });
    }
  }
});

document.getElementById("app").addEventListener("input", e => {
  if (e.target.id === "active-tool-input") dispatch({ type: "UPDATE_TAB_INPUT", tabId: e.target.dataset.tab, input: e.target.value });
  else if (e.target.id === "palette-input") dispatch({ type: "UPDATE_PALETTE_QUERY", query: e.target.value });
  else if (e.target.id === "home-search-input") dispatch({ type: "SET_HOME_QUERY", query: e.target.value });
});

document.getElementById("app").addEventListener("change", e => {
  if (e.target.id === "clip-preset-select") {
    const preset = DevToolsCore.CLIPBOARD_PRESETS.find(p => p.id === e.target.value);
    if (preset) dispatch({ type: "SET_CLIPBOARD", preset });
  } else if (e.target.id === "tool-mode-select") {
    dispatch({ type: "UPDATE_TAB_MODE", tabId: e.target.dataset.tab, mode: e.target.value });
  }
});

let dragState = null;
document.getElementById("app").addEventListener("mousedown", e => {
  const handle = e.target.closest("[data-split-handle]");
  if (!handle) return;
  const canvas = handle.closest(".tool-canvas");
  if (!canvas) return;
  dragState = { tabId: handle.dataset.splitHandle, rect: canvas.getBoundingClientRect(), vertical: canvas.classList.contains("split-v") };
  e.preventDefault();
});
window.addEventListener("mousemove", e => {
  if (!dragState) return;
  const ratio = dragState.vertical ? ((e.clientY - dragState.rect.top) / dragState.rect.height) * 100 : ((e.clientX - dragState.rect.left) / dragState.rect.width) * 100;
  dispatch({ type: "UPDATE_SPLIT_RATIO", tabId: dragState.tabId, ratio: Math.round(ratio) });
});
window.addEventListener("mouseup", () => { dragState = null; });

window.addEventListener("keydown", e => {
  const tag = (e.target?.tagName || "").toUpperCase();
  const isEditing = tag === "INPUT" || tag === "TEXTAREA" || tag === "SELECT" || e.target?.isContentEditable;
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "k") { e.preventDefault(); if (state.paletteOpen) dispatch({ type: "HANDLE_ESC" }); else dispatch({ type: "OPEN_PALETTE" }); return; }
  if ((e.ctrlKey || e.metaKey) && e.shiftKey && e.key.toLowerCase() === "v") { e.preventDefault(); dispatch({ type: "EXPLICIT_SMART_PASTE" }); return; }
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "w" && state.residency === "Active" && state.activeTabId) { e.preventDefault(); dispatch({ type: "CLOSE_TAB", tabId: state.activeTabId }); return; }
  if (e.key === "Escape") { e.preventDefault(); if (isEditing && document.activeElement?.blur && !state.paletteOpen) document.activeElement.blur(); dispatch({ type: "HANDLE_ESC" }); return; }
  if (state.paletteOpen) {
    const items = getPaletteItems(state);
    if (e.key === "ArrowDown") { e.preventDefault(); dispatch({ type: "MOVE_PALETTE_INDEX", index: Math.min(items.length - 1, state.paletteIndex + 1) }); return; }
    if (e.key === "ArrowUp") { e.preventDefault(); dispatch({ type: "MOVE_PALETTE_INDEX", index: Math.max(0, state.paletteIndex - 1) }); return; }
    if (e.key === "Enter" && items.length > 0) {
      e.preventDefault();
      const item = items[Math.min(state.paletteIndex, items.length - 1)];
      dispatch({ type: "OPEN_TOOL", toolId: item.tool.id, payload: item.smartRec ? state.clipboard.text : null, autoMode: item.smartRec ? item.smartRec.autoMode : null, forceNew: e.ctrlKey || e.metaKey, source: item.smartRec ? "smart" : "palette" });
    }
    return;
  }
  if (!state.activeTabId && state.residency === "Active" && e.key === "Enter" && !state.homeQuery.trim()) {
    const rec = !state.smartResult.skipped && state.smartResult.recommendations[0];
    if (rec && state.dismissedClipSeq !== state.clipboard.seq) { e.preventDefault(); dispatch({ type: "OPEN_TOOL", toolId: rec.toolId, payload: state.clipboard.text, autoMode: rec.autoMode, source: "smart" }); return; }
  }
  if (!isEditing && (e.key === "ArrowLeft" || e.key === "ArrowRight")) {
    e.preventDefault();
    const ids = DevToolsCore.VARIANTS.map(v => v.id);
    dispatch({ type: "SET_VARIANT", variant: ids[(ids.indexOf(state.variant) + (e.key === "ArrowRight" ? 1 : ids.length - 1)) % ids.length] });
  }
});

render();
</script>
</body>
</html>
