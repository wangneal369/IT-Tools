# cargo-deny compliance gates (V1 spec §7).
#
# Four gates:
#   1. advisories — deny vulnerabilities/yanks; temporary ignore ONLY for
#      RUSTSEC-2026-0543 (chrono) inherited from pinned gpui-pre 0.3.14.
#   2. licenses   — permissive SPDX identifiers only, with narrowly scoped
#      per-crate exceptions for three upstream MPL-2.0 crates and `ksni`
#      (Unlicense, Linux-only SNI tray backend).
#   3. bans       — block forbidden crates and direct workspace `chrono`.
#   4. sources    — crates.io registry only, no git sources.

[advisories]
yanked = "deny"
unmaintained = "workspace"
ignore = [
    # RUSTSEC-2026-0543 (`chrono` unmaintained): currently reaches native targets
    # exclusively via pinned `gpui-pre 0.3.14` and `gpui-pre-scheduler 0.3.14`
    # (and later `zxcvbn` on wasm32). Workspace crates use `jiff 1.0` exclusively.
    #
    # Exit criteria: remove this ignore as soon as the pinned `gpui-kit` /
    # `gpui-pre` release drops its `chrono` dependency.
    { id = "RUSTSEC-2026-0543", reason = "transitive via pinned gpui-pre 0.3.14 / gpui-pre-scheduler 0.3.14; workspace uses jiff exclusively" },
]

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "CC0-1.0",
    "0BSD",
    "BSL-1.0",
    "MIT-0",
]
confidence-threshold = 0.8

# Weak-copyleft MPL-2.0 is NOT allowed globally; grant scoped exceptions only
# to the three upstream transitive crates and the unmodified nucleo-matcher
# explicitly selected by ADR-0001 / V1 spec for the pure-Rust search engine.
exceptions = [
    { allow = ["MPL-2.0"], crate = "cbindgen" },
    { allow = ["MPL-2.0"], crate = "dwrote" },
    { allow = ["MPL-2.0"], crate = "option-ext" },
    # Linux SNI tray backend (Linux-only, via tray-icon's `ksni` feature).
    { allow = ["Unlicense"], crate = "ksni" },
    # File-level MPL obligations remain with this unmodified upstream crate;
    # no MPL source is copied into the workspace (V1's required search matcher).
    { allow = ["MPL-2.0"], crate = "nucleo-matcher@0.3.1" },
]

[licenses.private]
ignore = false

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true
deny = [
    { name = "serde_yaml", reason = "V1 uses serde-saphyr; deprecated serde_yaml is banned" },
    { name = "serde_yml", reason = "V1 uses serde-saphyr; unsound serde_yml is banned" },
    { name = "yaml-rust", reason = "V1 uses serde-saphyr; unmaintained yaml-rust is banned" },
    { name = "openssl", reason = "offline-only pure Rust stack; OpenSSL linkage is banned" },
    { name = "openssl-sys", reason = "offline-only pure Rust stack; OpenSSL linkage is banned" },
    { name = "aws-lc-rs", reason = "offline-only pure Rust stack; AWS-LC C linkage is banned" },
    { name = "aws-lc-sys", reason = "offline-only pure Rust stack; AWS-LC C linkage is banned" },
    { name = "p12", reason = "X.509 tool uses p12-keystore; unmaintained p12 is banned" },
    { name = "single-instance", reason = "single-instance IPC is owned by devtools-platform" },
    { name = "jsonpath-rust", reason = "JSONPath tool uses serde_json_path; jsonpath-rust is banned" },
    { name = "gpui", version = "<=0.2.2", reason = "stale official gpui; use pinned gpui-kit / gpui-pre" },
    { name = "chrono", wrappers = ["gpui-pre", "gpui-pre-scheduler"], reason = "direct chrono is banned; workspace uses jiff (transitive via gpui-pre 0.3.14 only)" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = [
    "https://github.com/rust-lang/crates.io-index",
]
allow-git = []
