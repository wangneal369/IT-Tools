<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <!-- Base obsidian-cobalt squircle surface -->
    <linearGradient id="bg-grad" x1="120" y1="60" x2="904" y2="964" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#223052"/>
      <stop offset="45%" stop-color="#141D33"/>
      <stop offset="100%" stop-color="#0B101D"/>
    </linearGradient>

    <!-- Studio backlight behind glyph -->
    <radialGradient id="center-glow" cx="512" cy="460" r="430" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#3B82F6" stop-opacity="0.38"/>
      <stop offset="52%" stop-color="#2563EB" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#0B101D" stop-opacity="0"/>
    </radialGradient>

    <!-- Secondary deep violet-indigo depth glow at bottom-right -->
    <radialGradient id="accent-glow" cx="760" cy="800" r="360" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#6366F1" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#0B101D" stop-opacity="0"/>
    </radialGradient>

    <!-- Subtle top specular sheen -->
    <radialGradient id="top-sheen" cx="512" cy="64" r="470" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#BAE6FD" stop-opacity="0.22"/>
      <stop offset="55%" stop-color="#60A5FA" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>

    <!-- Diagonal glass facet highlight -->
    <linearGradient id="glass-facet" x1="0" y1="0" x2="720" y2="720" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.09"/>
      <stop offset="55%" stop-color="#FFFFFF" stop-opacity="0.02"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>

    <!-- Crisp luminous glass rim -->
    <linearGradient id="rim-grad" x1="160" y1="48" x2="864" y2="976" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#BAE6FD" stop-opacity="0.78"/>
      <stop offset="28%" stop-color="#60A5FA" stop-opacity="0.48"/>
      <stop offset="70%" stop-color="#1E3A5F" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0.36"/>
    </linearGradient>

    <!-- Platinum-white chevrons -->
    <linearGradient id="chevron-grad" x1="512" y1="324" x2="512" y2="700" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="65%" stop-color="#EEF4FF"/>
      <stop offset="100%" stop-color="#C8DAF8"/>
    </linearGradient>

    <!-- Electric sky-to-cobalt-to-indigo center slash -->
    <linearGradient id="slash-grad" x1="590" y1="264" x2="434" y2="760" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#67E8F9"/>
      <stop offset="42%" stop-color="#38BDF8"/>
      <stop offset="78%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#6366F1"/>
    </linearGradient>

    <clipPath id="tile-clip">
      <rect x="48" y="48" width="928" height="928" rx="220"/>
    </clipPath>

    <filter id="glyph-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#040712" flood-opacity="0.68"/>
    </filter>

    <filter id="slash-glow" x="-40%" y="-25%" width="180%" height="150%">
      <feGaussianBlur stdDeviation="28"/>
    </filter>
  </defs>

  <!-- Main squircle body -->
  <g clip-path="url(#tile-clip)">
    <rect x="48" y="48" width="928" height="928" fill="url(#bg-grad)"/>
    <rect x="48" y="48" width="928" height="928" fill="url(#center-glow)"/>
    <rect x="48" y="48" width="928" height="928" fill="url(#accent-glow)"/>
    <rect x="48" y="48" width="928" height="928" fill="url(#top-sheen)"/>

    <!-- Subtle machined glass diagonal facet -->
    <path d="M48 48 L976 48 L976 340 L48 640 Z" fill="url(#glass-facet)"/>

    <!-- Subtle inner precision bevel -->
    <rect x="86" y="86" width="852" height="852" rx="184"
          fill="none" stroke="#FFFFFF" stroke-opacity="0.065" stroke-width="4"/>
  </g>

  <!-- Outer glass rim -->
  <rect x="55" y="55" width="914" height="914" rx="213"
        fill="none" stroke="url(#rim-grad)" stroke-width="14"/>

  <!-- Soft cyan-blue halo behind the center slash -->
  <path d="M578 272 L446 752"
        fill="none" stroke="#38BDF8" stroke-opacity="0.44"
        stroke-width="90" stroke-linecap="round"
        filter="url(#slash-glow)"/>

  <!-- Foreground sculpted code emblem: < / > -->
  <g filter="url(#glyph-shadow)" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- Left chevron < -->
    <path d="M352 356 L196 512 L352 668"
          stroke="url(#chevron-grad)" stroke-width="80"/>

    <!-- Right chevron > -->
    <path d="M672 356 L828 512 L672 668"
          stroke="url(#chevron-grad)" stroke-width="80"/>

    <!-- Center accent slash / -->
    <path d="M578 272 L446 752"
          stroke="url(#slash-grad)" stroke-width="82"/>
  </g>
</svg>
